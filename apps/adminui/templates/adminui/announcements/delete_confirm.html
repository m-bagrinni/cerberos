{% extends "adminui/base_admin.html" %}

{% block admin_title %}Удалить объявление{% endblock %}

{% block admin_content %}
<div class="panel" style="max-width:600px">
  <div class="panel__header">
    <h2 class="panel__title">Удалить объявление?</h2>
  </div>
  <div class="panel__body">
    <p><strong>{{ object.title }}</strong></p>
    <p class="text-muted" style="font-size:13px">Чтобы просто убрать его с главной, можно снять галочку «Активно».</p>
    <form method="post" style="margin-top:20px;display:flex;gap:8px">
      {% csrf_token %}
      <button type="submit" class="btn--danger"><i class="bi bi-trash"></i> Удалить</button>
      <a href="{% url 'adminui:announcements' %}" class="btn--secondary">Отмена</a>
    </form>
  </div>
</div>
{% endblock %}
