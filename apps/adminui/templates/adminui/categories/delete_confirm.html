{% extends "adminui/base_admin.html" %}
{% block admin_title %}Удалить категорию{% endblock %}
{% block admin_content %}
<div class="panel">
    <div class="panel__header">
        <h2 class="panel__title">Удалить категорию "{{ object.name }}"?</h2>
    </div>
    <div class="panel__body">
        <p>Устройства, привязанные к этой категории, останутся без категории.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn--danger">Удалить</button>
            <a href="{% url 'adminui:categories' %}" class="btn--secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
