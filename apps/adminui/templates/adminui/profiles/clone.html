{% extends "adminui/base_admin.html" %}

{% block admin_title %}Клонировать профиль{% endblock %}

{% block admin_content %}
<div class="panel" style="max-width:600px">
  <div class="panel__header">
    <h2 class="panel__title">Клонировать: {{ source.name }}</h2>
  </div>
  <div class="panel__body">
    <p class="text-muted">Будут скопированы все настройки профиля и {{ source.metrics.count }} метрик.</p>

    <form method="post" style="margin-top:16px">
      {% csrf_token %}
      <div class="aui-form__field">
        <label class="aui-form__label" for="id_name">Название</label>
        <input type="text" name="name" id="id_name" class="aui-input"
               value="{{ source.name }} (копия)" required>
      </div>
      <div class="aui-form__field">
        <label class="aui-form__label" for="id_slug">Slug</label>
        <input type="text" name="slug" id="id_slug" class="aui-input mono"
               value="{{ source.slug }}-copy" required>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button type="submit" class="btn--primary">
          <i class="bi bi-files"></i> Клонировать
        </button>
        <a href="{% url 'adminui:profile_detail' source.pk %}" class="btn--secondary">Отмена</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
