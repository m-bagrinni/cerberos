{% extends "adminui/base_admin.html" %}
{% block admin_title %}Удалить станцию{% endblock %}
{% block admin_content %}
<div class="panel" style="max-width: 500px;">
  <div class="panel__header"><h2 class="panel__title">Подтверждение</h2></div>
  <div class="panel__body">
    <p>Вы уверены, что хотите удалить станцию <strong>{{ object.name }}</strong>?</p>
    <form method="post">{% csrf_token %}
      <div class="form-actions">
        <button type="submit" class="btn--danger">Удалить</button>
        <a href="{% url 'adminui:stations' %}" class="btn--secondary">Отмена</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
