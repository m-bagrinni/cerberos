{% extends "base.html" %}
{% load static %}

{% block extra_css %}
{{ block.super }}
<style>
  .edocs-page { padding: 24px; width: 100%; }
  .edocs-title { font-size: 24px; font-weight: 600; color: var(--text-strong); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .edocs-title i { color: var(--primary); }
  .edocs-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .edocs-card__head { padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--bg-elevated); font-weight: 600; color: var(--text-strong); display: flex; align-items: center; gap: 8px; }
  .edocs-card__body { padding: 18px; }
  .edocs-field { margin-bottom: 14px; }
  .edocs-field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .edocs-field input, .edocs-field select, .edocs-field textarea {
    width: 100%; padding: 8px 12px; background: var(--bg-input); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text); font-size: 14px; font-family: inherit;
  }
  .edocs-field input:focus, .edocs-field select:focus, .edocs-field textarea:focus { outline: none; border-color: var(--primary); }
  .edocs-btn { background: var(--primary); color: #fff; border: none; padding: 9px 16px; border-radius: var(--radius); cursor: pointer; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
  .edocs-btn:hover { opacity: 0.85; color: #fff; }

  .edocs-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .edocs-table th { text-align: left; padding: 10px 14px; color: var(--text-muted); font-weight: 500; border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; }
  .edocs-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
  .edocs-table tr:last-child td { border-bottom: none; }
  .edocs-table tr:hover td { background: var(--bg-hover); }

  .edocs-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
  .edocs-badge--draft { background: rgba(142,142,142,0.15); color: var(--text-muted); }
  .edocs-badge--review { background: rgba(242,204,12,0.15); color: var(--warn); }
  .edocs-badge--approved { background: rgba(80, 205, 137, 0.15); color: var(--ok); }
  .edocs-badge--rejected { background: rgba(242,73,92,0.15); color: var(--crit); }

  .edocs-actions { display: flex; gap: 8px; align-items: center; }
  .edocs-action-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; font-size: 16px; transition: color 0.15s; text-decoration: none; }
  .edocs-action-btn:hover { color: var(--text-strong); }
  .edocs-action-btn--danger:hover { color: var(--crit); }
  
  .edocs-empty { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px; }
  
  /* Модалка */
  .edocs-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; align-items: center; justify-content: center; }
  .edocs-modal.is-open { display: flex; }
  .edocs-modal__content { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); width: 90%; max-width: 1000px; height: 90vh; display: flex; flex-direction: column; }
  .edocs-modal__head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--bg-elevated); color: var(--text-strong); font-weight: 600; }
  .edocs-modal__close { background: transparent; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
  .edocs-modal__close:hover { color: var(--text-strong); }
  
  .edocs-modal__body { flex: 1; position: relative; overflow: hidden; background: #111217; padding: 0; }
  .edocs-modal__body iframe { width: 100%; height: 100%; border: none; position: relative; z-index: 2; }
  
  /* Индикатор загрузки */
  .edocs-loader {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #111217; color: var(--text-muted); z-index: 1;
  }
  .edocs-spinner {
    width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--primary); border-radius: 50%;
    animation: edocs-spin 1s linear infinite; margin-bottom: 16px;
  }
  @keyframes edocs-spin { to { transform: rotate(360deg); } }
</style>
{% endblock %}

{% block content %}
<div class="edocs-page">
  <div class="edocs-title">
    <i class="bi bi-file-earmark-text"></i> Электронный документооборот
  </div>
  {% block edocs_content %}{% endblock %}
</div>

<!-- Модальное окно -->
<div class="edocs-modal" id="edocsPreviewModal">
  <div class="edocs-modal__content">
    <div class="edocs-modal__head">
      <span id="edocsModalTitle">Просмотр документа</span>
      <button type="button" class="edocs-modal__close" onclick="closeEdocsModal()">&times;</button>
    </div>
    <div class="edocs-modal__body">
      <div class="edocs-loader" id="edocsLoader">
        <div class="edocs-spinner"></div>
        <div>Загрузка PDF...</div>
      </div>
      <iframe id="edocsModalFrame" src="" onload="document.getElementById('edocsLoader').style.display='none';"></iframe>
    </div>
  </div>
</div>

<script>
function openEdocsModal(id, title) {
    document.getElementById('edocsModalTitle').textContent = title;
    
    // Показываем загрузчик
    document.getElementById('edocsLoader').style.display = 'flex';
    
    // Загружаем iframe
    const frame = document.getElementById('edocsModalFrame');
    frame.src = "/edocs/document/" + id + "/view/";
    
    // Открываем модалку
    document.getElementById('edocsPreviewModal').classList.add('is-open');
}
function closeEdocsModal() {
    document.getElementById('edocsPreviewModal').classList.remove('is-open');
    const frame = document.getElementById('edocsModalFrame');
    frame.src = ""; // Останавливаем загрузку
}
document.getElementById('edocsPreviewModal').addEventListener('click', function(e) {
    if (e.target === this) closeEdocsModal();
});
</script>
{% endblock %}
