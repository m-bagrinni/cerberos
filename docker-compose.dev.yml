# Оверрайд для локальной разработки.
# Запуск: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  web:
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
      - ./mibs:/app/mibs:ro
      - /var/lib/mibs:/var/lib/mibs:ro
    ports:
      - "8000:8000"
    environment:
      DJANGO_ENV: dev
      MIBDIRS: /app/mibs/active:/app/mibs/standard:/usr/share/snmp/mibs:/var/lib/mibs/ietf
    command: >
      python manage.py runserver 0.0.0.0:8000

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
      - ./mibs:/app/mibs:ro
      - /var/lib/mibs:/var/lib/mibs:ro
    env_file: .env
    environment:
      DJANGO_ENV: dev
      MIBDIRS: /app/mibs/active:/app/mibs/standard:/usr/share/snmp/mibs:/var/lib/mibs/ietf
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A cerber worker -l info --concurrency=4

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
    env_file: .env
    environment:
      DJANGO_ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A cerber beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
