# Оверрайд для локальной разработки.
# Запуск: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  postgres:
    command: postgres -c max_connections=300
    # Порты НЕ публикуются — конфликт с системным PostgreSQL
    # Внутри docker-сети доступен как postgres:5432

  redis:
    # Порты НЕ публикуются — конфликт с системным Redis
    # Внутри docker-сети доступен как redis:6379

  web:
    user: "${CUID:-1000}:${CGID:-1000}"
    # Без privileged / pid: host / docker.sock: web опубликован в интернет.
    # Всё, что требует docker (sniffer, контейнеры) — через сервис ops.
    # group 138 — только чтобы читать .env (640 admin:docker).
    # no-new-privileges НЕ ставим: fping получает NET_RAW через file capabilities.
    group_add:
      - "138"
    ports:
      # Хост 8888 → контейнер 8000 (8000 занят NetXMS)
      - "8888:8000"
    volumes:
      - .:/app
      - ./mibs:/app/mibs:ro
      - /var/lib/mibs:/var/lib/mibs:ro
      - pcap_data:/tmp/cerber_pcap
    environment:
      DJANGO_ENV: dev
      MIBDIRS: /app/mibs/active:/app/mibs/standard:/usr/share/snmp/mibs:/var/lib/mibs/ietf
    command: >
      daphne -b 0.0.0.0 -p 8000 cerber.asgi:application
  worker_critical:
    build:
      context: .
      dockerfile: docker/Dockerfile
    user: "${CUID:-1000}:${CGID:-1000}"
    group_add:
      - "138"
    volumes:
      - .:/app
      - ./mibs:/app/mibs:ro
      - /var/lib/mibs:/var/lib/mibs:ro
    env_file: .env
    environment:
      DJANGO_ENV: dev
      MIBDIRS: /app/mibs/active:/app/mibs/standard:/usr/share/snmp/mibs:/var/lib/mibs/ietf
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: >
      celery -A cerber worker -l info --concurrency=4 -Q critical

  worker_high:
    build:
      context: .
      dockerfile: docker/Dockerfile
    user: "${CUID:-1000}:${CGID:-1000}"
    group_add:
      - "138"
    volumes:
      - .:/app
      - ./mibs:/app/mibs:ro
      - /var/lib/mibs:/var/lib/mibs:ro
    env_file: .env
    environment:
      DJANGO_ENV: dev
      MIBDIRS: /app/mibs/active:/app/mibs/standard:/usr/share/snmp/mibs:/var/lib/mibs/ietf
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: >
      celery -A cerber worker -l info --concurrency=2 -Q high

  worker_main:
    build:
      context: .
      dockerfile: docker/Dockerfile
    user: "${CUID:-1000}:${CGID:-1000}"
    group_add:
      - "138"
    volumes:
      - .:/app
      - ./mibs:/app/mibs:ro
      - /var/lib/mibs:/var/lib/mibs:ro
    env_file: .env
    environment:
      DJANGO_ENV: dev
      MIBDIRS: /app/mibs/active:/app/mibs/standard:/usr/share/snmp/mibs:/var/lib/mibs/ietf
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: >
      celery -A cerber worker -l info --concurrency=2 -Q default

  worker_low:
    build:
      context: .
      dockerfile: docker/Dockerfile
    user: "${CUID:-1000}:${CGID:-1000}"
    group_add:
      - "138"
    volumes:
      - .:/app
      - ./mibs:/app/mibs:ro
      - /var/lib/mibs:/var/lib/mibs:ro
    env_file: .env
    environment:
      DJANGO_ENV: dev
      MIBDIRS: /app/mibs/active:/app/mibs/standard:/usr/share/snmp/mibs:/var/lib/mibs/ietf
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: >
      celery -A cerber worker -l info --concurrency=1 -Q low

  worker_traffic:
    build:
      context: .
      dockerfile: docker/Dockerfile
    user: "${CUID:-1000}:${CGID:-1000}"
    group_add:
      - "138"
    env_file: .env
    environment:
      DJANGO_ENV: dev
      MIBDIRS: /app/mibs/active:/app/mibs/standard:/usr/share/snmp/mibs:/var/lib/mibs/ietf
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - .:/app
      - ./mibs:/app/mibs:ro
      - /var/lib/mibs:/var/lib/mibs:ro
      - pcap_data:/tmp/cerber_pcap
    command: >
      celery -A cerber worker -l info --concurrency=1 -Q traffic

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    user: "${CUID:-1000}:${CGID:-1000}"
    group_add:
      - "138"   # группа docker: читать .env (права 640)
    volumes:
      - .:/app
    env_file: .env
    environment:
      DJANGO_ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A cerber beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  telegram_bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    user: "${CUID:-1000}:${CGID:-1000}"
    group_add:
      - "138"
    volumes:
      - .:/app
      - ./mibs:/app/mibs:ro
      - /var/lib/mibs:/var/lib/mibs:ro
    env_file: .env
    environment:
      DJANGO_ENV: dev
      MIBDIRS: /app/mibs/active:/app/mibs/standard:/usr/share/snmp/mibs:/var/lib/mibs/ietf
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: >
      python manage.py run_telegram_bot

  # Единственный контейнер с docker.sock. Узкий HTTP API (ops/agent.py):
  # список/рестарт контейнеров cerber-* и белый список команд в sniffer.
  # Порт наружу не публикуется; доступ — из docker-сети с OPS_TOKEN.
  # Секреты .env сюда НЕ передаются — только OPS_TOKEN.
  ops:
    image: cerber-web:latest      # тот же образ: python + docker CLI
    pull_policy: never
    container_name: cerber-ops
    user: "${CUID:-1000}:${CGID:-1000}"
    group_add:
      - "138"                     # группа docker — доступ к сокету
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["python", "/ops/agent.py"]
    working_dir: /ops
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      OPS_TOKEN: ${OPS_TOKEN}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./ops:/ops:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9100/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cerber-cloudflared
    restart: unless-stopped
    command: tunnel --url http://web:8000 --no-autoupdate
    depends_on:
      - web
    networks:
      - default

  sniffer:
    image: nicolaka/netshoot:latest
    container_name: cerber-sniffer
    network_mode: host
    privileged: true
    cap_add:
      - NET_RAW
      - NET_ADMIN
    pid: host
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped
    command: ["sleep", "infinity"]
    volumes:
      - pcap_data:/tmp/cerber_pcap

volumes:
  pcap_data:
