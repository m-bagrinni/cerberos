# Оверрайд для локальной разработки.
# Запуск: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  postgres:
    # Порты НЕ публикуются — конфликт с системным PostgreSQL
    # Внутри docker-сети доступен как postgres:5432

  redis:
    # Порты НЕ публикуются — конфликт с системным Redis
    # Внутри docker-сети доступен как redis:6379

  web:
    user: "${CUID:-1000}:${CGID:-1000}"
    group_add:
      - "138"
    volumes:
      - .:/app
      - ./mibs:/app/mibs:ro
      - /var/lib/mibs:/var/lib/mibs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # Хост 8888 → контейнер 8000 (8000 на сервере занят NetXMS)
      - "8888:8000"
    environment:
      DJANGO_ENV: dev
      MIBDIRS: /app/mibs/active:/app/mibs/standard:/usr/share/snmp/mibs:/var/lib/mibs/ietf
    command: >
      python manage.py runserver 0.0.0.0:8000

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    user: "${CUID:-1000}:${CGID:-1000}"
    group_add:
      - "138"
    volumes:
      - .:/app
      - ./mibs:/app/mibs:ro
      - /var/lib/mibs:/var/lib/mibs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file: .env
    environment:
      DJANGO_ENV: dev
      MIBDIRS: /app/mibs/active:/app/mibs/standard:/usr/share/snmp/mibs:/var/lib/mibs/ietf
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A cerber worker -l info --concurrency=4

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    user: "${CUID:-1000}:${CGID:-1000}"
    volumes:
      - .:/app
    env_file: .env
    environment:
      DJANGO_ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A cerber beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
