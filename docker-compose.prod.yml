# Продакшн-override.
# Запуск: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Отличия от base:
#   - web: gunicorn, без volume-а кода, entrypoint.prod.sh
#   - worker, beat: без volume-а кода
#   - nginx: reverse proxy
#   - postgres/redis: НЕ публикуются наружу
#   - порты 80/443 публикует только nginx

services:
  postgres:
    # В проде порты НЕ публикуются
    ports: !reset []

  redis:
    ports: !reset []

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_ENV: prod
    entrypoint: ["/usr/bin/tini", "--", "/usr/local/bin/entrypoint.prod.sh"]
    command: >
      gunicorn cerber.wsgi:application
        --bind 0.0.0.0:8000
        --workers 3
        --threads 2
        --timeout 120
        --access-logfile -
        --error-logfile -
        --log-level info
    volumes:
      - static:/app/staticfiles
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_ENV: prod
    command: >
      celery -A cerber worker
        -l info
        --concurrency=4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_ENV: prod
    command: >
      celery -A cerber beat
        -l info
        --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"   # раскомментировать после настройки SSL
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/var/www/static:ro
      - media:/var/www/media:ro
      # - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      - web

volumes:
  static:
  media:
