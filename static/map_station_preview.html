<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Station Map Preview</title>
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css" />
  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; background: #111217; }
    #map { width: 100%; height: 100%; }
    .leaflet-container { background: #111217; }
    .leaflet-control-attribution { display: none; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = L.map('map', { zoomControl: true, attributionControl: false }).setView([42.87, 74.59], 10);
    
    L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      maxZoom: 19
    }).addTo(map);

    let routeLayer = null;
    let markerLayer = null;

    window.addEventListener('message', (e) => {
      if (!e.data || e.data.type !== 'drawRoute') return;
      const { path_geojson, station_lat, station_lon } = e.data;
      
      if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
      if (markerLayer) { map.removeLayer(markerLayer); markerLayer = null; }

      if (path_geojson && path_geojson.length > 1) {
        routeLayer = L.polyline(path_geojson, {
          color: '#ff780a', weight: 4, opacity: 0.9
        }).addTo(map);
        map.fitBounds(routeLayer.getBounds(), { padding: [20, 20] });
      }

      if (station_lat && station_lon) {
        const icon = L.divIcon({
          className: 'custom-div-icon',
          html: '<div style="background:#0abfbc; width:16px; height:16px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 8px rgba(10,191,188,0.7);"></div>',
          iconSize: [16, 16],
          iconAnchor: [8, 8]
        });
        markerLayer = L.marker([station_lat, station_lon], { icon }).addTo(map);
      }
    });

    window.parent.postMessage({ type: 'mapReady' }, '*');
  </script>
</body>
</html>
