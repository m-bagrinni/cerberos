{% comment %}
Изолированный шаблон вкладки «Сеть» для /alerts/.
Не трогает текущую логику device-алертов.
{% endcomment %}

<div class="alerts-tabs" id="alertsTabs">
    <button type="button" class="alerts-tab alerts-tab--active" data-tab="devices">
        <i class="bi bi-hdd-network"></i> Устройства
    </button>
    <button type="button" class="alerts-tab" data-tab="network">
        <i class="bi bi-radar"></i> Сеть
        <span class="alerts-tab__count alerts-tab__count--crit" id="networkTabBadge" style="display:none;">0</span>
    </button>
</div>

<div id="networkTabContent" style="display:none;">
    <div class="network-alerts-toolbar">
        <h2><i class="bi bi-radar"></i> Аномалии трафика</h2>
        <span class="network-alerts-info" id="networkAlertsInfo"></span>
    </div>

    <div id="networkActive">
        <div class="empty-state">Загрузка...</div>
    </div>

    <div id="networkHistory" style="margin-top: 24px;"></div>
</div>
